project:
  type: book
  output-dir: _book # where the output is saved

book:
  title: "Ruminant Farm Systems (RuFaS)"
  subtitle: "Scientific Documentation"
  date: "4/1/2026"
  output-file: "rufas-scientific-documentation" # name of output file (non-html)
  search: true
  page-navigation: true
  favicon: "resources/images/rufas_icon.png" # browser tab icon
  chapters:
    - index.qmd
    - qmd/versionupdates.qmd
    - qmd/example_structures.qmd # should be removed from final build
    - qmd/animal.qmd
    - qmd/manure.qmd
    - qmd/soil_and_crop.qmd
    - qmd/feed_storage.qmd
    - qmd/economics.qmd
    - qmd/connections.qmd
    - qmd/abbrevs.qmd
    
execute: 
  echo: false

bibliography: resources/rufas.bib

format:
  html:
    theme: cosmo
    crossref:
      eq-prefix: ""
    css: resources/templates/styles.css
